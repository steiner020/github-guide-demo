name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

      - name: Prompt eval (smoke)
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("prompts/story-template.md").read_text(encoding="utf-8")
          required = ["背景", "验收标准", "待确认问题"]
          missing = [word for word in required if word not in text]
          if missing:
              raise SystemExit(f"提示词缺少字段: {missing}")
          print("prompt eval: ok")
          PY
