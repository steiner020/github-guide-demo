name: 缺陷报告
description: 报告一个可复现的问题
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索是否已有相同 Issue。贴日志或截图前，确认其中不含密钥、客户数据和真实个人信息。

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净环境开始，按顺序写清楚每一步。
      placeholder: |
        1. 运行 ...
        2. 输入 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 粘贴报错信息时，请先去掉令牌、邮箱和客户名称。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 例如 v0.1.0 或提交 SHA。
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 影响范围
      options:
        - 阻塞：无法继续工作
        - 严重：主要功能不可用
        - 一般：有替代方案
        - 轻微：体验问题
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索重复 Issue
          required: true
        - label: 已移除敏感信息
          required: true
