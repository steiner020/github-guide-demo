name: 需求
description: 提出一个可执行的需求、改进或新功能
title: "[需求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出需求。请把「问题」和「方案」分开写：先描述谁在什么场景下遇到了什么困难，再写期望的结果。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？现在是怎么解决的？
      placeholder: 作为……我希望……以便……
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 完成后，用户能看到或做到什么？
      placeholder: 描述可观察的结果，而不是实现方案。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 每条都能被测试或演示。
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P1（本迭代必须完成）
        - P2（本迭代尽量完成）
        - P3（下个迭代再看）
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 风险与依赖
      description: 需要谁配合？有哪些不确定因素？
    validations:
      required: false

  - type: checkboxes
    id: dod
    attributes:
      label: 完成定义
      options:
        - label: 已补充或更新测试
        - label: 已更新文档
        - label: 已在评审中演示
